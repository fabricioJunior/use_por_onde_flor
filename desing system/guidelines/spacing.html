<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Escala 4px base" name="Spacing scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="padding:20px;background:var(--surface-card);height:180px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;font-family:var(--font-sans);font-size:11px;color:var(--text-secondary)">
  <div style="display:flex;align-items:center;gap:10px;"><span style="width:40px">4</span><div style="height:10px;width:var(--space-1);background:var(--brand-primary)"></div></div>
  <div style="display:flex;align-items:center;gap:10px;"><span style="width:40px">8</span><div style="height:10px;width:var(--space-2);background:var(--brand-primary)"></div></div>
  <div style="display:flex;align-items:center;gap:10px;"><span style="width:40px">16</span><div style="height:10px;width:var(--space-4);background:var(--brand-primary)"></div></div>
  <div style="display:flex;align-items:center;gap:10px;"><span style="width:40px">24</span><div style="height:10px;width:var(--space-5);background:var(--brand-primary)"></div></div>
  <div style="display:flex;align-items:center;gap:10px;"><span style="width:40px">32</span><div style="height:10px;width:var(--space-6);background:var(--brand-primary)"></div></div>
  <div style="display:flex;align-items:center;gap:10px;"><span style="width:40px">48</span><div style="height:10px;width:var(--space-7);background:var(--brand-primary)"></div></div>
  <div style="display:flex;align-items:center;gap:10px;"><span style="width:40px">64</span><div style="height:10px;width:var(--space-8);background:var(--brand-primary)"></div></div>
</div>
