<!-- @dsCard group="Colors" viewport="700x220" subtitle="Aliases semânticos usados nos componentes" name="Semantic" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px;font-family:var(--font-sans);background:var(--surface-page);height:220px;box-sizing:border-box;">
  <div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px;font-size:12px;color:var(--text-secondary)">surface-card</div>
  <div style="background:var(--surface-sunken);border-radius:var(--radius-md);padding:12px;font-size:12px;color:var(--text-secondary)">surface-sunken</div>
  <div style="background:var(--surface-inverse);border-radius:var(--radius-md);padding:12px;font-size:12px;color:var(--text-on-inverse)">surface-inverse</div>
  <div style="background:var(--brand-tint);border-radius:var(--radius-md);padding:12px;font-size:12px;color:var(--brand-primary-deep)">brand-tint</div>
  <div style="grid-column:span 2;color:var(--text-primary);font-size:14px">text-primary — Título e corpo principal</div>
  <div style="grid-column:span 2;color:var(--text-secondary);font-size:14px">text-secondary — legendas, metadados</div>
  <div style="color:var(--link-color);font-size:14px;text-decoration:underline">link-color</div>
  <div style="color:var(--state-error);font-size:14px">state-error</div>
  <div style="color:var(--state-success);font-size:14px">state-success</div>
  <div style="color:var(--state-warning);font-size:14px">state-warning</div>
</div>
