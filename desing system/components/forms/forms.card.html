<!-- @dsCard group="Components" viewport="700x360" name="Forms: Input, Select, Checkbox, Radio, Switch" -->
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.PorOndeFlor;
function Demo() {
  const [c, setC] = React.useState(true);
  const [r, setR] = React.useState('padrao');
  const [s, setS] = React.useState(false);
  return (
    <div style={{fontFamily:'var(--font-sans)',padding:'24px',background:'var(--surface-page)',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px'}}>
      <Input label="E-mail" placeholder="voce@email.com" />
      <Input label="CEP" defaultValue="00000-000" error="CEP inválido" />
      <Select label="Tamanho" options={[{value:'p',label:'P'},{value:'m',label:'M'},{value:'g',label:'G'}]} />
      <div style={{display:'flex',flexDirection:'column',gap:'12px',justifyContent:'center'}}>
        <Checkbox label="Receber novidades" checked={c} onChange={()=>setC(!c)} />
        <Radio label="Entrega padrão" checked={r==='padrao'} onChange={()=>setR('padrao')} />
        <Radio label="Entrega expressa" checked={r==='expressa'} onChange={()=>setR('expressa')} />
        <Switch label="Salvar cartão" checked={s} onChange={()=>setS(!s)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
