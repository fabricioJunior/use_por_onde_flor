@if (variante === 'cheia') {
  <div class="pof-loader-cheia">
    <app-logo variante="negativa" [altura]="40"></app-logo>
    <svg class="pof-loader-svg" viewBox="0 0 260 60" aria-hidden="true">
      <path d="M 4 34 C 34 34 40 12 70 12 C 100 12 106 48 136 48 C 166 48 172 12 202 12 C 228 12 240 26 256 30"
            fill="none" stroke="rgba(160,176,139,.22)" stroke-width="4" stroke-linecap="round" />
      <path class="pof-loader-dash"
            d="M 4 34 C 34 34 40 12 70 12 C 100 12 106 48 136 48 C 166 48 172 12 202 12 C 228 12 240 26 256 30"
            fill="none" stroke="#A0B08B" stroke-width="4" stroke-linecap="round"
            pathLength="100" stroke-dasharray="34 66" />
    </svg>
    <p>{{ texto }}</p>
  </div>
} @else {
  <svg class="pof-loader-inline" viewBox="0 0 60 16" role="status" aria-label="Carregando">
    <path d="M 2 9 C 10 9 12 3 20 3 C 28 3 30 13 38 13 C 46 13 48 5 58 6"
          fill="none" stroke="rgba(248,241,235,.3)" stroke-width="2.4" stroke-linecap="round" />
    <path class="pof-loader-dash-inline"
          d="M 2 9 C 10 9 12 3 20 3 C 28 3 30 13 38 13 C 46 13 48 5 58 6"
          fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
          pathLength="100" stroke-dasharray="30 70" />
  </svg>
}
