<div class="container">

    @if(loading()){
    <p>Carregando...</p>
    }@else if(dataSource != null){
    <div class="header-card">
        <div>
            <span class="eyebrow">Produto</span>
            <h3>{{ this.dataSource.descricao }}</h3>
        </div>

        <div class="actions">
            <a class="pof-btn-primary" [routerLink]="linkDaReferencia">
                <mat-icon>open_in_new</mat-icon>
                Acessar referência
            </a>

            <button class="pof-btn-secondary" type="button"
                (click)="copiarLinkDaReferencia()">
                <mat-icon>content_copy</mat-icon>
                Copiar link
            </button>
        </div>

        @if(linkCopiado()) {
        <span class="copy-feedback">Link copiado com sucesso.</span>
        }
    </div>

    <div class="table-container">
        <table>
            <thead>

                <tr>
                    <th>Cor/Tamanho</th>
                    <th *ngFor="let coluna of dataSource.tamanhos">{{ coluna
                        }}</th>
                </tr>

            </thead>
            <tbody>
                <tr *ngFor="let cor of dataSource.cores">
                    <td>{{cor}}</td>

                    <td *ngFor="let tamanho of dataSource.tamanhos">
                        {{dataSource.corTamanhoParaQuantidade![`${cor}_${tamanho}`]}}
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    }

</div>
