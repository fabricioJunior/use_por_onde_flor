<div class="email-group" [formGroup]="formGroup">

  <div class="pof-email-atual">
    <span>{{formGroup.get('email')?.value}}</span>
    <button type="button" class="pof-btn-text" (click)="trocarEmail()">Trocar</button>
  </div>

  <div class="pof-field" [class.pof-field-error]="errorMessage()">
    <label for="login-senha">Senha</label>
    <input id="login-senha" type="password" placeholder="Sua senha"
      formControlName="senha">
    @if (errorMessage()) {
    <span class="pof-field-error-msg">{{errorMessage()}}</span>
    }
  </div>

  <div class="row">
    <button type="button" id="esqueceu-seu-email-button"
      (click)="onEsqueceuSenha()"
      class="pof-btn-text">Esqueceu sua senha?
    </button>
    <app-filled-button [label]="'Avançar'"
      [enabled]="avancaEnable()" (onTap)="login()"></app-filled-button>
  </div>

</div>
