<div class="email-group" [formGroup]="loginGroup">
  <div class="pof-field" [class.pof-field-error]="errorMessage()">
    <label for="login-email">E-mail</label>
    <input id="login-email" type="email" placeholder="seu@email.com"
      formControlName="email" [value]="loginGroup.get('email')?.value">
    @if (errorMessage()) {
    <span class="pof-field-error-msg">{{errorMessage()}}</span>
    }
  </div>

  <div class="button-group">
    <button type="button" (click)="abrirCadastro()" class="pof-btn-text">Criar conta</button>
    <app-filled-button [label]="'Avançar'"
      [enabled]="avancaEnable()" (onTap)="onAvancarTap()"></app-filled-button>
  </div>
</div>
