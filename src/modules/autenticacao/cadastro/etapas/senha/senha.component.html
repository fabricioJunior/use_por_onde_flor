
<div [formGroup]="formGroup">
    <div id="acao-container">
        <h2 class="title">Senha de acesso</h2>
        <p> Crie uma senha com no minímo 6 digitos</p>
    </div>
    <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input type="password" matInput placeholder="Senha" maxlength="20"
            formControlName="senha"
            [value]="formGroup.get('senha')?.value">
        <mat-error>
            {{senhaError()}}
        </mat-error>
    </mat-form-field>

    <mat-checkbox class="aceite-regulamento"
        formControlName="aceitouRegulamento">
        Declaro que li o regulamento do site.
    </mat-checkbox>
    <button class="btn-regulamento" mat-button type="button"
        (click)="abrirRegulamento()">
        Ver regulamento
    </button>

    @if(formGroup.get('aceitouRegulamento')?.value !== true){
    <p class="aceite-error">Você deve aceitar o regulamento do site.</p>
    }

    @if(loading()){
    <mat-spinner></mat-spinner>
    }@else{
    <div class="row">
        <app-filled-button [label]="'Avançar'"
            [enabled]="avancaEnable()"
            (onTap)="onAvancarTap()"></app-filled-button>
    </div>
    }

</div>
