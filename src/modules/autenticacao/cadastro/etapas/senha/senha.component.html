<app-cadastro-progresso [etapa]="4" [total]="4" [label]="'Senha'"></app-cadastro-progresso>

<div [formGroup]="formGroup" class="pof-auth-form">
    <div id="acao-container">
        <h1 class="title">Senha de acesso</h1>
        <p>Crie uma senha com no mínimo 6 dígitos</p>
    </div>

    <div class="pof-field" [class.pof-field-error]="senhaError()">
        <label for="cadastro-senha">Senha</label>
        <input id="cadastro-senha" type="password" placeholder="Senha" maxlength="20"
            formControlName="senha"
            [value]="formGroup.get('senha')?.value">
        @if (senhaError()) {
        <span class="pof-field-error-msg">{{senhaError()}}</span>
        }
    </div>

    <div class="regulamento-box">
        <label class="regulamento-checkbox">
            <input type="checkbox" formControlName="aceitouRegulamento">
            Declaro que li o regulamento do site.
        </label>
        <button class="pof-btn-text" type="button"
            (click)="abrirRegulamento()">
            Ver regulamento
        </button>
    </div>

    @if(formGroup.get('aceitouRegulamento')?.value !== true){
    <p class="aceite-error">Você deve aceitar o regulamento do site.</p>
    }

    <div class="row">
        <app-filled-button [label]="'Avançar'"
            [enabled]="avancaEnable()"
            [loading]="loading()"
            (onTap)="onAvancarTap()"></app-filled-button>
    </div>

</div>
