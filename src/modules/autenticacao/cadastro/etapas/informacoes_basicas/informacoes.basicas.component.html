<app-cadastro-progresso [etapa]="2" [total]="4" [label]="'Dados'"></app-cadastro-progresso>

<div id="acao-container">
  <h1 class="title">Informações básicas</h1>
  <p>Insira sua data de nascimento e CPF</p>
</div>

<div [formGroup]="formGroup" class="pof-auth-form">

  <div class="data_nascimento_container">
    <div class="pof-field campo-dia">
      <label for="cadastro-dia">Dia</label>
      <input id="cadastro-dia" type="text" placeholder="Dia" maxlength="2"
        formControlName="dia" [value]="formGroup.get('dia')?.value">
    </div>

    <div class="pof-field campo-mes">
      <label for="cadastro-mes">Mês</label>
      <select id="cadastro-mes" formControlName="mes"
        [value]="formGroup.get('mes')?.value">
        <option value="1">Janeiro</option>
        <option value="2">Fevereiro</option>
        <option value="3">Março</option>
        <option value="4">Abril</option>
        <option value="5">Maio</option>
        <option value="6">Junho</option>
        <option value="7">Julho</option>
        <option value="8">Agosto</option>
        <option value="9">Setembro</option>
        <option value="10">Outubro</option>
        <option value="11">Novembro</option>
        <option value="12">Dezembro</option>
      </select>
    </div>

    <div class="pof-field campo-ano">
      <label for="cadastro-ano">Ano</label>
      <input id="cadastro-ano" type="text" placeholder="Ano" [maxLength]="4"
        formControlName="ano" [value]="formGroup.get('ano')?.value">
    </div>
  </div>
  @if (dataError()) {
  <span class="pof-field-error-msg">{{dataError()}}</span>
  }

  <div class="pof-field" [class.pof-field-error]="cpfError()">
    <label for="cadastro-cpf">CPF</label>
    <input id="cadastro-cpf" type="text" placeholder="CPF" [maxLength]="14"
      formControlName="cpf" [value]="formGroup.get('cpf')?.value"
      mask="000.000.000-00||00.000.000/0000-00">
    @if (cpfError()) {
    <span class="pof-field-error-msg">{{cpfError()}}</span>
    }
  </div>

  <div class="row">
    <app-filled-button [label]="'Avançar'"
      [enabled]="avancaEnable()"
      [loading]="loading()"
      (onTap)="onAvancarTap()"></app-filled-button>
  </div>

</div>
