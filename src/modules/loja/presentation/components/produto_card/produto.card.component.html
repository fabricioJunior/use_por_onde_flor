<article class="produto-card" (click)="abrir.emit()">
    <div class="produto-foto">
        @if (referencia.media_url) {
        <img [src]="referencia.media_url" [alt]="referencia.nome">
        } @else {
        <span class="produto-foto-placeholder">Sem foto</span>
        }
    </div>
    <div class="produto-info">
        <span class="produto-nome">{{ referencia.nome }}</span>
        <div class="produto-rodape">
            <span class="produto-preco">{{ formatarPreco(referencia.valor) }}</span>
            <ui-button size="sm" variant="secondary" (clicked)="onAdicionarClick($event)">Adicionar</ui-button>
        </div>
    </div>
</article>
