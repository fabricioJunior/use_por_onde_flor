<article class="card" [class.sem-estoque]="semEstoque()" (mouseenter)="garantirProdutos()">
    <button type="button" class="card-foto pof-foto-fundo" [attr.aria-label]="referencia.nome" (click)="abrir()">
        @if (referencia.media_url) {
        <img [src]="referencia.media_url" [alt]="referencia.nome">
        }
        @if (percentualOff; as off) {
        <span class="card-selo desconto">-{{ off }}%</span>
        }
    </button>

    <h3 class="card-nome"><a [routerLink]="['/loja/referencia', referencia.id]">{{ referencia.nome }}</a></h3>

    <div class="card-precos">
        @if (precoDe; as de) {
        <span class="card-preco-de">{{ formatarPreco(de) }}</span>
        }
        <span class="card-preco">{{ formatarPreco(preco) }}</span>
    </div>

    @if (parcelamento(); as texto) {
    <span class="card-parcelamento">{{ texto }}</span>
    }

    @if (tamanhos().length > 1) {
    <div class="card-tamanhos">
        @for (tamanho of tamanhos(); track tamanho) {
        <button type="button" class="pof-chip" [class.selecionado]="tamanhoSelecionado() === tamanho"
            (click)="escolherTamanho(tamanho, $event)">{{ tamanho }}</button>
        }
    </div>
    }

    @if (avisoTamanho()) {
    <span class="card-aviso">Escolha um tamanho</span>
    }

    <button type="button" class="pof-btn-escuro card-comprar" [disabled]="semEstoque() || ocupado()"
        (click)="comprar($event)">
        @if (semEstoque()) { Indisponível } @else { Comprar }
    </button>
</article>
