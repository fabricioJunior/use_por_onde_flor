<header class="loja-header">
    <div class="loja-header-inner">
        <a routerLink="/loja" class="loja-logo-link">
            <img src="/logo-primary-color.png" alt="Por Onde Flor" class="loja-logo-img">
        </a>
        <nav class="loja-nav">
            <a routerLink="/loja">Novidades</a>
            <a routerLink="/loja">Roupas</a>
            <a routerLink="/loja">Acessórios</a>
        </nav>
        <div class="loja-header-acoes">
            <a routerLink="/carrinho" class="loja-sacola">
                Sacola
                @if (itensNoCarrinho > 0) {
                <span class="loja-sacola-badge">{{ itensNoCarrinho }}</span>
                }
            </a>
            @if (estaAutenticado()) {
            <details class="loja-conta">
                <summary class="loja-conta-resumo">
                    <span class="loja-conta-icone">&#128100;</span>
                    {{ nomeDoUsuario() }}
                </summary>
                <div class="loja-conta-menu">
                    <a routerLink="/home">Cartão fidelidade</a>
                    <a routerLink="/pedidos">Meus pedidos</a>
                </div>
            </details>
            } @else {
            <a routerLink="/login" [queryParams]="{returnUrl: router.url}" class="loja-login-link">Login</a>
            }
        </div>
    </div>
</header>
