@if (total) {
<section class="hero" aria-label="Banners">
    <div class="hero-palco desktop">
        @for (banner of desktop(); track banner.id; let i = $index) {
        @if (banner.type === 'Vídeo') {
        <video [src]="banner.url" [style.opacity]="i === indice() ? 1 : 0" autoplay muted loop playsinline></video>
        } @else {
        <img [src]="banner.url" alt="" [style.opacity]="i === indice() ? 1 : 0">
        }
        }
    </div>
    <div class="hero-palco mobile">
        @for (banner of mobile(); track banner.id; let i = $index) {
        @if (banner.type === 'Vídeo') {
        <video [src]="banner.url" [style.opacity]="i === indice() ? 1 : 0" autoplay muted loop playsinline></video>
        } @else {
        <img [src]="banner.url" alt="" [style.opacity]="i === indice() ? 1 : 0">
        }
        }
    </div>

    @if (total > 1) {
    <button type="button" class="hero-seta anterior" aria-label="Banner anterior" (click)="passar(-1)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
        </svg>
    </button>
    <button type="button" class="hero-seta proxima" aria-label="Próximo banner" (click)="passar(1)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
        </svg>
    </button>

    <div class="hero-indicadores">
        @for (i of pilulas; track i) {
        <button type="button" class="hero-pilula" [class.ativa]="i === indice()" (click)="ir(i)"
            [attr.aria-label]="'Ver banner ' + (i + 1)"></button>
        }
    </div>
    }
</section>
}
