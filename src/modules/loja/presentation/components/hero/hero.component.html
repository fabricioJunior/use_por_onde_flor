@if (total) {
<section class="hero" aria-label="Banners" (pointerenter)="pausar()" (pointerleave)="retomar()"
    (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)">
    @for (slide of slides(); track slide.id; let i = $index) {
    <div class="hero-slide" [style.opacity]="i === indice() ? 1 : 0" [attr.aria-hidden]="i === indice() ? null : true">
        @if (slide.video) {
        <video [src]="slide.desktop" autoplay muted loop playsinline></video>
        } @else {
        <!-- Com link o slide vira <a> de verdade (abre em nova aba, teclado, SEO); sem link,
             continua uma imagem. O clique é cancelado quando o gesto foi um arrasto. -->
        @if (destinoDoSlide(slide); as href) {
        <a class="hero-link" [href]="href" (click)="aoClicar($event, slide)"
            [attr.tabindex]="i === indice() ? null : -1">
            <picture>
                <source media="(max-width: 819px)" [srcset]="slide.mobile">
                <img [src]="slide.desktop" alt="" [attr.loading]="i === 0 ? 'eager' : 'lazy'"
                    [attr.fetchpriority]="i === 0 ? 'high' : null">
            </picture>
        </a>
        } @else {
        <picture>
            <source media="(max-width: 819px)" [srcset]="slide.mobile">
            <img [src]="slide.desktop" alt="" [attr.loading]="i === 0 ? 'eager' : 'lazy'"
                [attr.fetchpriority]="i === 0 ? 'high' : null">
        </picture>
        }
        }
    </div>
    }

    @if (total > 1) {
    <button type="button" class="hero-seta anterior" aria-label="Banner anterior" (click)="passar(-1)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
        </svg>
    </button>
    <button type="button" class="hero-seta proxima" aria-label="Próximo banner" (click)="passar(1)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
        </svg>
    </button>

    <div class="hero-indicadores">
        @for (i of pilulas; track i) {
        <button type="button" class="hero-pilula" [class.ativa]="i === indice()" (click)="ir(i)"
            [attr.aria-label]="'Ver banner ' + (i + 1)"></button>
        }
    </div>
    }
</section>
}
