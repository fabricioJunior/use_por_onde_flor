<div [formGroup]="novoPagamentoForm!" class="novo-pagamento-form">
    <mat-form-field appearance="outline" class="form-field">
        <mat-label>Valor</mat-label>
        <input matInput type="number" placeholder="Digite o valor"
            matInput type="text"
            placeholder="Digite o valor"
            formControlName="valor"
            required
            mask="separator.2"
            thousandSeparator="."
            decimalMarker=","
            formControlName="valor" required>
        <mat-error
            *ngIf="novoPagamentoForm?.get('valor')?.hasError('required') ?? false">
            Valor é obrigatório.
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
        <mat-label>Instagram</mat-label>
        <input matInput type="text" placeholder="@seuusuario"
            formControlName="instagram">
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
        <mat-label>Telefone</mat-label>
        <input matInput type="tel" placeholder="(99) 99999-9999"
            formControlName="telefone">
    </mat-form-field>

    <mat-error *ngIf="novoPagamentoForm?.hasError('contatoObrigatorio')">
        Preencha pelo menos o Instagram ou o Telefone.
    </mat-error>

    <button mat-flat-button color="primary" type="submit"
        (click)="onSubmit()"
        [disabled]="novoPagamentoForm?.invalid ?? true">
        Novo Pagamento
    </button>
</div>
