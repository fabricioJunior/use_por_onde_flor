<div class="container">
    <app-logo> </app-logo>
    @if(pedidoId()){
    <h1>Pedido #{{ pedidoId() }} recebido!</h1>
    <p>Assim que o pagamento for confirmado, você será notificado.</p>
    } @else {
    <h1>Processando...</h1>
    <app-pof-loader variante="inline"></app-pof-loader>
    @if(pagamentoExpirado()){
    <h1>Pagamento expirado.</h1>
    }
    @if(fluxoInvalido()){
    <h1>Nao foi possivel processar este pagamento.</h1>
    }
    }
</div>
